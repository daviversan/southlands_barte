# Regras de negócio parametrizadas (PLANO.md seção 4). Trocar aqui, não no código.
# Etiquetas: SABEMOS | CONFIRMADO | PARCIAL | ASSUMIDO (ver HIPOTESES.md).

arredondamento:                     # CONFIRMADO: Orbe trunca, Tarvo arredonda normalmente
  modo: ROUND_HALF_UP
  casas: 2

checkout:
  base_comissao: taxa_contratada    # CONFIRMADO (P1): bruto x taxa contratada, sem custo da Orbe
  limiar_divergencia_brl: 0.01      # ASSUMIDO (P13): guarda contra ruído; comparação é entre taxas
  vigencia_venda: data_movimento    # ASSUMIDO (P11) para venda normal
  vigencia_estorno: data_venda_original   # CONFIRMADO (P2)
  estorno_abate_em: mes_do_estorno  # CONFIRMADO: agosto não é reaberto
  antecipacao_mesma_nota: true      # CONFIRMADO (P3)
  nf_tomador: lojista               # ASSUMIDO (P16)
  nf_saldo_nao_positivo: pendencia  # CONFIRMADO: não emite nota, vira pendência (Financeiro)
  # Roteamento de venda cujo EC não está no cadastro (nível Mínimo). EC fora desta lista cai em
  # CADASTRO_NAO_RESOLVIDO / Financeiro. Nunca resolve identidade por nome; só decide quem responde.
  ec_sem_cadastro:
    "1076801732":                   # Atlas Idiomas: só existe na aba "ANTIGO 2025" (P8, PARCIAL)
      tipo: CONTRATO_AUSENTE
      quem_decide: Comercial        # CONFIRMADO: Comercial decide; Atlas não é faturada até confirmar a taxa
      motivo: sem contrato na aba vigente da planilha; a taxa é decidida pelo Comercial e a venda não é comissionada até lá.
    "1043300981":                   # Horizonte Intercâmbio: Horizonte Viagens ou Novo Horizonte? (P7, ABERTA)
      tipo: CONTRATO_AMBIGUO
      quem_decide: Comercial        # ASSUMIDO: segue a tabela de tipos do contrato técnico
      motivo: pode ser Horizonte Viagens ou Novo Horizonte (ambos sem EC na planilha); não adivinhar, uma pessoa precisa confirmar.

remessa:
  participacao_tarvo: 0.5           # SABEMOS (e-mail da Ponte)
  base_spread: realizado            # CONFIRMADO (P6): Spread R$, não o estimado D-1
  spread_negativo: contestacao      # CONFIRMADO: fora da comissão e da nota; quem_decide = Financeiro
  operacao_repetida: contar_uma_vez # CONFIRMADO: conta 1x e vai para a lista de correção da Ponte
  precisao_spread_pct: 0.00001      # DECIDIDO: relatório traz Spread % com 5 casas
  aprovado_com_ressalva_entra: true # ASSUMIDO (P10): segue o e-mail da Ponte
  spread_padrao: null               # ABERTA (P4): sem valor, divergência desses lojistas não é calculada
  nf_tomador:                       # SABEMOS (assinatura do e-mail da Ponte)
    cnpj: "75374179000146"
    nome: Ponte Câmbio

bancos:
  folha_e_impostos_de_08: baixa_provisao   # ASSUMIDO (P12): baixa_provisao | despesa
  confianca_minima_ia: 0.8                 # Extra: abaixo disso vira pendência HUMANO

  aurora_ref_offset: 0
  janela_contrapartida_dias: 3
  regras:
    - id: pix_contabilidade
      banco: AURORA
      padrao: ^PIX ENVIADO CONTABILIDADE
      conta: 4.2.06
    - id: pix_sem_identificacao
      banco: AURORA
      padrao: ^PIX RECEBIDO .*SEM IDENTIFICACAO
      conta: 1.1.09.002
      pendencia: CREDITO_NAO_IDENTIFICADO
    - id: recebivel_orbe
      banco: AURORA
      padrao: ^TED RECEBIDA .*ORBE
      conta: 1.1.03.001
    - id: repasse_lojista
      banco: AURORA
      padrao: '^PIX ENVIADO '
      conta: 2.1.01.001
    - id: transferencia_saida
      banco: AURORA
      padrao: ^TRANSF ENTRE CONTAS
      conta: 1.1.09.001
      contrapartida: saida
    - id: devolucao_pix
      banco: AURORA
      padrao: ^DEVOLUCAO PIX
      conta: 2.1.01.002
    - id: tarifa_aurora
      banco: AURORA
      padrao: '^TAR '
      conta: 4.2.01
    - id: condominio
      banco: AURORA
      padrao: CONDOMINIO
      conta: 4.2.02
    - id: infraestrutura
      banco: AURORA
      padrao: AMAZON|AWS
      conta: 4.2.03
    - id: google
      banco: AURORA
      padrao: GOOGLE
      conta: 4.2.04
    - id: pis
      banco: AURORA
      padrao: DARF .*PIS
      conta: 2.1.03.001
    - id: cofins
      banco: AURORA
      padrao: DARF .*COFINS
      conta: 2.1.03.002
    - id: irrf
      banco: AURORA
      padrao: DARF .*IRRF
      conta: 2.1.03.004
    - id: iss
      banco: AURORA
      padrao: ^PAGTO ISS
      conta: 2.1.03.003
    - id: salarios
      banco: AURORA
      padrao: SALARIOS
      conta: 2.1.04.001
      contas_por_modo:
        baixa_provisao: 2.1.04.001
        despesa: 4.1.01
    - id: inss
      banco: AURORA
      padrao: ^GPS INSS
      conta: 2.1.04.002
      contas_por_modo:
        baixa_provisao: 2.1.04.002
        despesa: null
    - id: fgts
      banco: AURORA
      padrao: ^GRF FGTS
      conta: 2.1.04.003
      contas_por_modo:
        baixa_provisao: 2.1.04.003
        despesa: null
    - id: pix_remessa
      banco: MERIDIANO
      padrao: '^PIX RECEB '
      conta: 2.1.02.001
    - id: liquidacao_ponte
      banco: MERIDIANO
      padrao: ^TED ENVIADA PONTE .*LIQ OPERACOES
      conta: 2.1.02.001
    - id: transferencia_entrada
      banco: MERIDIANO
      padrao: ^TED RECEBIDA TARVO .*MESMA TITULARIDADE
      conta: 1.1.09.001
      contrapartida: entrada
    - id: comissao_ponte
      banco: MERIDIANO
      padrao: ^TED RECEB PONTE .*REPASSE COMISSAO
      conta: 1.1.03.002
    - id: aplicacao
      banco: MERIDIANO
