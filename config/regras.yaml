      conta: 1.1.02.001
    - id: resgate
      banco: MERIDIANO
      padrao: ^RESGATE .*CDB
      conta: 1.1.02.001
    - id: rendimento
      banco: MERIDIANO
      padrao: ^RENDIMENTO
      conta: 3.2.01
    - id: iof
      banco: MERIDIANO
      padrao: ^IOF
      conta: 4.3.01
    - id: seguro
